[package]
name = "lol_wiki_md"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "League of Legends MediaWiki dump -> strict Markdown converter (Rust port)"
repository = "https://example.com/placeholder"
keywords = ["league-of-legends", "mediawiki", "markdown", "converter"]
categories = ["command-line-utilities", "parsing"]

[workspace]
members = ["."]

[lib]
name = "lol_wiki_md"
path = "src/lib.rs"

[features]
default = ["full"]
full = ["rayon", "serde/derive"]
minimal = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
regex = "1.11"
once_cell = "1.19"
hashbrown = "0.14"
rayon = { version = "1.11", optional = true }
lazy_static = "1.5"
blake3 = "1.5"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports" ] }
tempfile = "3.10"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
regex = "1.11"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dev]
debug = true
