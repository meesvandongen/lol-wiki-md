[package]
name = "lol-wiki-export"
version = "0.2.2"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.18"
urlencoding = "2.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "std", "serde"] }
html-escape = "0.2"