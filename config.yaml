# League of Legends Wiki to Markdown Converter Configuration

# Formula conversion settings
formula_style: "katex"  # Options: katex, latex, plain

# Content inclusion settings
include_patch_history: true
include_trivia: true
include_images: true
include_skins: true

# Cross-reference settings
cross_reference_style: "relative"  # Options: relative, absolute, none

# Output settings
output_format: "individual"  # Options: individual, combined
create_index: true

# Image settings
copy_images: false  # Whether to copy image files to output directory
image_base_url: "./images/"  # Base URL for image references

# Template customization
custom_templates_dir: null  # Path to custom Jinja2 templates

# Processing options
skip_on_error: true  # Continue processing other champions if one fails
verbose: true  # Enable detailed logging

# Champion filtering
exclude_champions: []  # List of champions to skip
include_only: []  # If specified, only convert these champions

# Markdown formatting
table_of_contents: true
section_numbering: false
formula_inline_threshold: 50  # Character limit for inline vs block formulas